name: "URMIX release (signed APK + GitHub + Telegram)"

# FASE 6 §7.2: manual release pipeline. Requires repository secrets:
# KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD,
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, plus SIGNER_SHA256_HEX to pin §7.1.
# P0 §1.2 additionally consumes URMIX_SUPABASE_URL and URMIX_SUPABASE_ANON_KEY
# (optional: when unset the APK is built with the default project URL and an
# empty anon key, so the app simply keeps using its cached remote config).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: "Restore release keystore from secrets"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "missing KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/urmix-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/urmix-release.jks" "$KEYSTORE_PASSWORD" \
            "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: "Build signed release APK"
        env:
          URMIX_SUPABASE_URL: ${{ secrets.URMIX_SUPABASE_URL }}
          URMIX_SUPABASE_ANON_KEY: ${{ secrets.URMIX_SUPABASE_ANON_KEY }}
        run: ./gradlew clean assembleRelease --stacktrace

      - name: "Verify signature pins the §7.1 keystore"
        env:
          SIGNER_SHA256_HEX: ${{ secrets.SIGNER_SHA256_HEX }}
        run: |
          APK=$(ls -1 app/build/outputs/apk/release/*.apk | grep -v -- '-unsigned' | head -n1)
          test -n "$SIGNER_SHA256_HEX" || { echo "missing SIGNER_SHA256_HEX"; exit 1; }

          # apksigner lives inside the SDK build-tools directory and is NOT on
          # PATH on GitHub runners, so resolve it explicitly:
          # $APKSIGNER override > PATH > known SDK roots (latest build-tools).
          APKSIGNER="${APKSIGNER:-$(command -v apksigner || true)}"
          if [ -z "$APKSIGNER" ]; then
            for root in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" \
                        /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              [ -n "$root" ] && [ -d "$root/build-tools" ] || continue
              APKSIGNER=$(find "$root/build-tools" -maxdepth 2 -type f \
                -name 'apksigner*' | sort -V | tail -n1)
              [ -n "$APKSIGNER" ] && break
            done
          fi
          echo "apksigner: ${APKSIGNER:-<not found>}"

          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          else
            # Fallback that needs no SDK: the v1 signature certificate via JDK.
            echo "build-tools candidates:"
            ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* 2>/dev/null || true
            keytool -printcert -jarfile "$APK" | tee "$RUNNER_TEMP/certs.txt"
          fi

          # keytool prints "SHA256: AA:BB:…" whereas SIGNER_SHA256_HEX is bare
          # lowercase hex (grep -qi already ignores case), so also try without
          # colons before refusing to publish.
          if grep -qi "$SIGNER_SHA256_HEX" "$RUNNER_TEMP/certs.txt"; then
            echo "signer fingerprint matches SIGNER_SHA256_HEX"
          elif tr -d ':' < "$RUNNER_TEMP/certs.txt" | grep -qi "$SIGNER_SHA256_HEX"; then
            echo "signer fingerprint matches SIGNER_SHA256_HEX (colons stripped)"
          else
            echo "signer fingerprint mismatch — refusing to publish"
            exit 1
          fi

      - name: "Rename APK + resolve changelog"
        id: pkg
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then TAG="${{ github.ref_name }}";
          else TAG="${{ inputs.tag }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          CODE=$(grep -E 'URMIX_VERSION_CODE *=' buildSrc/src/main/kotlin/ProjectConfig.kt \
            | grep -oE '[0-9]+')
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/$CODE.txt"
          test -f "$CHANGELOG" || { echo "missing $CHANGELOG"; exit 1; }
          APK=$(ls -1 app/build/outputs/apk/release/*.apk | grep -v -- '-unsigned' | head -n1)
          OUT="app/build/outputs/apk/release/URMIX_v$VERSION.apk"
          mv "$APK" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "changelog=$CHANGELOG" >> "$GITHUB_OUTPUT"

      - name: "Publish GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          files: ${{ steps.pkg.outputs.apk }}
          body_path: ${{ steps.pkg.outputs.changelog }}

      - name: "Publish to Telegram"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "missing TELEGRAM_BOT_TOKEN"; exit 1; }
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" \
            -F "chat_id=$TELEGRAM_CHAT_ID" \
            -F "document=@${{ steps.pkg.outputs.apk }}" \
            -F "caption=$(cat ${{ steps.pkg.outputs.changelog }})"

      - name: "Upload APK artifact (backup)"
        uses: actions/upload-artifact@v7
        with:
          name: urmix-release-apk
          path: app/build/outputs/apk/release/*.apk
