<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 512" width="1536" height="512">
  <!-- URMIX Empty State Illustrations Sheet (3 Variants on 512x512 Artboards) -->

  <!-- ==================== VARIANT 1: NO INTERNET (x: 0..512) ==================== -->
  <g id="empty-no-internet" transform="translate(0, 0)">
    <!-- Outer Arc (Inactive Charcoal) -->
    <path d="M 166,160 A 110,110 0 0,1 346,160" fill="none" stroke="#2A2A2A" stroke-width="12" stroke-linecap="round" />

    <!-- Active Arc (Deep Blue Accent) -->
    <path d="M 196,202 A 75,75 0 0,1 316,202" fill="none" stroke="#1A56DB" stroke-width="12" stroke-linecap="round" />

    <!-- Disconnected Slash Line -->
    <line x1="160" y1="330" x2="352" y2="138" stroke="#2A2A2A" stroke-width="12" stroke-linecap="round" />

    <!-- Floating Play-Button Node (Deep Blue) -->
    <polygon points="250,300 268,312 250,324" fill="#1A56DB" />
  </g>

  <!-- ==================== VARIANT 2: EMPTY HISTORY (x: 512..1024) ==================== -->
  <g id="empty-history" transform="translate(512, 0)">
    <!-- Vinyl Disc Body -->
    <circle cx="712" cy="236" r="82" fill="none" stroke="#2A2A2A" stroke-width="12" />
    <circle cx="712" cy="236" r="52" fill="none" stroke="#2A2A2A" stroke-width="6" />

    <!-- Spindle Ring & Center Play Cutout (Deep Blue Accent) -->
    <circle cx="712" cy="236" r="26" fill="none" stroke="#1A56DB" stroke-width="8" />
    <polygon points="708,228 720,236 708,244" fill="#1A56DB" />

    <!-- Fading Audio Waveform (Lower Right) -->
    <g fill="#1A56DB">
      <rect x="822" y="206" width="8" height="60" rx="4" opacity="1.0" />
      <rect x="842" y="216" width="8" height="40" rx="4" opacity="0.7" />
      <rect x="862" y="224" width="8" height="24" rx="4" opacity="0.45" />
      <rect x="882" y="229" width="8" height="14" rx="4" opacity="0.25" />
      <rect x="902" y="232" width="8" height="8" rx="4" opacity="0.12" />
    </g>

    <!-- Thin Baseline -->
    <line x1="600" y1="350" x2="924" y2="350" stroke="#2A2A2A" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- ==================== VARIANT 3: NO SEARCH RESULT (x: 1024..1536) ==================== -->
  <g id="empty-no-search" transform="translate(1024, 0)">
    <!-- Magnifying Glass Frame -->
    <circle cx="1260" cy="226" r="76" fill="none" stroke="#2A2A2A" stroke-width="12" />
    <line x1="1316" y1="282" x2="1376" y2="342" stroke="#2A2A2A" stroke-width="14" stroke-linecap="round" />

    <!-- Inner Empty Play Triangle (Deep Blue Accent) -->
    <polygon points="1250,204 1282,226 1250,248" fill="none" stroke="#1A56DB" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Small Accent Dot (Deep Blue Accent on Glass Rim) -->
    <circle cx="1260" cy="150" r="5" fill="#1A56DB" />
  </g>
</svg>
