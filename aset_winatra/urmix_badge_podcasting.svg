<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- URMIX Podcasting Category Badge (48x48dp) -->
  <!-- Dark Charcoal Rounded-Square Base (Radius 12dp) -->
  <rect width="48" height="48" rx="12" fill="#181818"/>

  <!-- Podcasting Glyph: Minimal Microphone + Sound Wave Arcs -->
  <g id="podcasting-glyph">
    <!-- Microphone Head (Deep Blue #1A56DB) -->
    <rect x="21" y="11" width="6" height="11" rx="3" fill="#1A56DB"/>

    <!-- U-Shaped Bracket & Stand (White #FFFFFF) -->
    <path d="M 16 17 A 8 8 0 0 0 32 17" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="25" x2="24" y2="30" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="30" x2="28" y2="30" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Sound Wave Arcs (Deep Blue #1A56DB) -->
    <path d="M 11 14 A 12 12 0 0 0 11 26" fill="none" stroke="#1A56DB" stroke-width="2" stroke-linecap="round"/>
    <path d="M 37 14 A 12 12 0 0 1 37 26" fill="none" stroke="#1A56DB" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
