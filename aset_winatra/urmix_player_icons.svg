<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 96" width="384" height="96">
  <!-- URMIX Minimal Music Player Control Icons Sheet (24x24dp base grid per icon) -->
  <!-- Row 1: Default State (#FFFFFF) | Row 2: Active State (#1A56DB) -->

  <!-- ==================== ROW 1: DEFAULT STATE (#FFFFFF) ==================== -->
  <g fill="#FFFFFF" transform="translate(0, 0)">
    <!-- 1. Play (Filled Triangle) -->
    <g transform="translate(0, 0)">
      <path d="M 8,5.5 C 7.172,5.5 6.5,6.172 6.5,7 L 6.5,17 C 6.5,17.828 7.172,18.5 8,18.5 C 8.35,18.5 8.68,18.37 8.94,18.15 L 17.44,13.15 C 18.09,12.76 18.5,12.06 18.5,11.3 C 18.5,10.54 18.09,9.84 17.44,9.45 L 8.94,4.45 C 8.68,4.23 8.35,4.1 8,4.1 Z" />
    </g>

    <!-- 2. Pause (Two Rounded Bars) -->
    <g transform="translate(48, 0)">
      <rect x="6" y="4" width="4" height="16" rx="2" />
      <rect x="14" y="4" width="4" height="16" rx="2" />
    </g>

    <!-- 3. Next (Skip Forward) -->
    <g transform="translate(96, 0)">
      <path d="M 5,5 C 4.45,5 4,5.45 4,6 L 4,18 C 4,18.55 4.45,19 5,19 C 5.25,19 5.5,18.9 5.7,18.75 L 14.7,12.75 C 15.1,12.45 15.3,12 15.3,11.5 C 15.3,11 15.1,10.55 14.7,10.25 L 5.7,4.25 C 5.5,4.1 5.25,4 5,4 Z M 18,4 C 17.45,4 17,4.45 17,5 L 17,19 C 17,19.55 17.45,20 18,20 C 18.55,20 19,19.55 19,19 L 19,5 C 19,4.45 18.55,4 18,4 Z" />
    </g>

    <!-- 4. Previous (Skip Back) -->
    <g transform="translate(144, 0)">
      <path d="M 6,4 C 5.45,4 5,4.45 5,5 L 5,19 C 5,19.55 5.45,20 6,20 C 6.55,20 7,19.55 7,19 L 7,5 C 7,4.45 6.55,4 6,4 Z M 19,5 C 18.45,5 18,5.45 18,6 L 18,18 C 18,18.55 18.45,19 19,19 C 19.25,19 19.5,18.9 19.7,18.75 L 10.7,12.75 C 10.3,12.45 10.1,12 10.1,11.5 C 10.1,11 10.3,10.55 10.7,10.25 L 19.7,4.25 C 19.5,4.1 19.25,4 19,4 Z" />
    </g>

    <!-- 5. Shuffle (Crossed Arrows) -->
    <g transform="translate(192, 0)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 16,3 L 21,3 L 21,8" />
      <path d="M 4,20 L 10,14 M 15,9 L 21,3" />
      <path d="M 21,16 L 21,21 L 16,21" />
      <path d="M 4,4 L 21,21" />
    </g>

    <!-- 6. Repeat (Circular Arrows) -->
    <g transform="translate(240, 0)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 17,2 L 21,6 L 17,10" />
      <path d="M 3,11 C 3,7.5 5.8,4.6 9.3,4.6 L 20,4.6" />
      <path d="M 7,22 L 3,18 L 7,14" />
      <path d="M 21,13 C 21,16.5 18.2,19.4 14.7,19.4 L 4,19.4" />
    </g>

    <!-- 7. Queue (Lines + Play Accent) -->
    <g transform="translate(288, 0)">
      <rect x="3" y="5" width="12" height="2" rx="1" />
      <rect x="3" y="11" width="12" height="2" rx="1" />
      <rect x="3" y="17" width="8" height="2" rx="1" />
      <path d="M 17,13.5 C 16.4,13.5 16,13.9 16,14.5 L 16,19.5 C 16,20.1 16.4,20.5 17,20.5 C 17.2,20.5 17.4,20.4 17.6,20.3 L 21.6,17.8 C 22,17.5 22.1,17 22.1,16.5 C 22.1,16 22,15.5 21.6,15.2 L 17.6,12.7 C 17.4,12.6 17.2,12.5 
17,12.5 17,12.5 Z" />
    </g>
  </g>
</svg>
