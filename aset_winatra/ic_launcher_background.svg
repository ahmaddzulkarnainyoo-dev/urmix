<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Subtle Deep Blue Radial Center Glow -->
    <radialGradient id="bgRadialGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1A56DB" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="1.0"/>
    </radialGradient>
  </defs>

  <!-- Base Dark Charcoal Layer -->
  <rect width="1024" height="1024" fill="#121212"/>

  <!-- Soft Radial Accent Field -->
  <rect width="1024" height="1024" fill="url(#bgRadialGlow)"/>
</svg>
