<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- URMIX Trending Audio Category Badge (48x48dp) -->
  <!-- Dark Charcoal Rounded-Square Base (Radius 12dp) -->
  <rect width="48" height="48" rx="12" fill="#181818"/>

  <!-- Geometric Glyph: Upward Trending Line + Integrated Audio Bars -->
  <g id="trending-glyph">
    <!-- Trending Arrow Line (Deep Blue #1A56DB) -->
    <path d="M 10 32 L 17 25 L 22 28 L 30 18" fill="none" stroke="#1A56DB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 24 18 L 30 18 L 30 24" fill="none" stroke="#1A56DB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 3 Audio Waveform Bars at Tip -->
    <rect x="33" y="22" width="2.5" height="10" rx="1.25" fill="#1A56DB"/>
    <rect x="37" y="16" width="2.5" height="16" rx="1.25" fill="#FFFFFF"/>
    <rect x="41" y="12" width="2.5" height="20" rx="1.25" fill="#1A56DB"/>
  </g>
</svg>
