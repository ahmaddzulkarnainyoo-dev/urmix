    <text x="540" y="1380" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle">Donasi via Saweria / QRIS</text>

    <rect x="220" y="1430" width="640" height="70" rx="20" fill="none" stroke="#444444" stroke-width="2"/>
    <text x="540" y="1474" font-family="Inter, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#B3B3B3" text-anchor="middle">Nanti Saja</text>
  </g>

  <!-- Caption Below Phone -->
  <text x="540" y="1710" font-family="Inter, -apple-system, sans-serif" font-weight="600" font-size="32" fill="#B3B3B3" text-anchor="middle" letter-spacing="1">Dukung Kami</text>
