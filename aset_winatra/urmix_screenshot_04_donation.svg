    <text x="540" y="920" font-family="Inter, -apple-system, sans-serif" font-weight="400" font-size="20" fill="#B3B3B3" text-anchor="middle">Bantu kami menjaga kelangsungan URMIX</text>

    <!-- QR Placeholder Box -->
    <rect x="380" y="960" width="320" height="320" rx="20" fill="#262626" stroke="#333333" stroke-width="2"/>
    <rect x="410" y="990" width="70" height="70" fill="#1A56DB"/>
    <rect x="425" y="1005" width="40" height="40" fill="#262626"/>
    <rect x="435" y="1015" width="20" height="20" fill="#1A56DB"/>

    <rect x="610" y="990" width="70" height="70" fill="#1A56DB"/>
    <rect x="625" y="1005" width="40" height="40" fill="#262626"/>
    <rect x="635" y="1015" width="20" height="20" fill="#1A56DB"/>

    <rect x="410" y="1190" width="70" height="70" fill="#1A56DB"/>
    <rect x="425" y="1205" width="40" height="40" fill="#262626"/>
    <rect x="435" y="1215" width="20" height="20" fill="#1A56DB"/>

    <rect x="500" y="990" width="30" height="30" fill="#FFFFFF"/>
    <rect x="550" y="1040" width="40" height="20" fill="#FFFFFF"/>
    <rect x="500" y="1080" width="50" height="50" fill="#1A56DB"/>
