<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 24" width="64" height="24">
  <!-- URMIX Audio-First / Video Surface Toggle Icon -->
  <!-- Left (x=0..24): Inactive State (#FFFFFF) | Right (x=32..56): Active State (#1A56DB) -->

  <!-- ==================== 1. INACTIVE STATE (#FFFFFF) ==================== -->
  <g fill="#FFFFFF" transform="translate(0, 0)">
    <!-- Audio Waveform Side (Left) -->
    <rect x="2" y="9" width="2" height="6" rx="1" />
    <rect x="5.5" y="5" width="2" height="14" rx="1" />
    <rect x="9" y="8" width="2" height="8" rx="1" />

    <!-- Toggle Direction Indicator (Center) -->
    <path d="M 12.5,10.5 L 14.5,12 L 12.5,13.5 Z" />

    <!-- Video Surface Screen Side (Right) -->
    <rect x="15.5" y="6" width="9" height="12" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M 18.5,9.5 L 22,12 L 18.5,14.5 Z" />
  </g>

  <!-- ==================== 2. ACTIVE STATE (#1A56DB) ==================== -->
  <g fill="#1A56DB" transform="translate(32, 0)">
    <!-- Audio Waveform Side (Left) -->
    <rect x="2" y="9" width="2" height="6" rx="1" />
    <rect x="5.5" y="5" width="2" height="14" rx="1" />
    <rect x="9" y="8" width="2" height="8" rx="1" />

    <!-- Toggle Direction Indicator (Center) -->
    <path d="M 12.5,10.5 L 14.5,12 L 12.5,13.5 Z" />

    <!-- Video Surface Screen Side (Right) -->
    <rect x="15.5" y="6" width="9" height="12" rx="1.5" fill="none" stroke="#1A56DB" stroke-width="1.5" />
    <path d="M 18.5,9.5 L 22,12 L 18.5,14.5 Z" />
  </g>
</svg>
